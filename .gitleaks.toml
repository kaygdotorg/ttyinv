title = "ttyinv secret-scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Only reviewed fixture values are allowed."
# Keep paths empty so tracked generated files remain scanned.
paths = []
regexes = [
  '''FR0{11}''',
  '''DE0{9}''',
  '''billing@example\.com''',
  '''example\.com''',
]
