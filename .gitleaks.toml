title = "ttyinv secret-scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Only known fabricated documentation values are allowed."
paths = [
  '''^LICENSE$''',
  '''(^|/)(?:dist|build|target)(/|$)''',
]
regexes = [
  '''FR0{11}''',
  '''DE0{9}''',
  '''billing@example\.com''',
  '''example\.com''',
]
