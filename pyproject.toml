[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ttyinv"
version = "0.2.0"
description = "Render strict Markdown invoices as terminal-inspired self-contained HTML and A4 PDF."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "ttyinv contributors" }]
keywords = ["invoice", "markdown", "pdf", "html", "cli", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "babel>=2.14,<3",
  "beautifulsoup4>=4.12,<5",
  "click>=8.1,<9",
  "fonttools[woff]>=4.53,<5",
  "markdown-it-py>=3,<4",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "pypdf>=5,<6",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "Pillow>=10,<12",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
ttyinv = "ttyinv.cli_v2:main"

[project.urls]
Homepage = "https://github.com/kaygdotorg/ttyinv"
Repository = "https://github.com/kaygdotorg/ttyinv"
Issues = "https://github.com/kaygdotorg/ttyinv/issues"

[tool.hatch.build]
artifacts = [
  "/src/ttyinv/fonts/GeistMono-Regular.woff2",
  "/src/ttyinv/fonts/GeistMono-SemiBold.woff2",
  "/src/ttyinv/fonts/OFL.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttyinv"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/examples",
  "/schema",
  "/docs",
  "/README.md",
  "/SPEC.md",
  "/PRIVACY.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/Makefile",
  "/constraints-release.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ttyinv"]

[tool.coverage.report]
show_missing = true
skip_covered = true
