[workspace]
members = ["apps/cli", "crates/ttyinv-core", "crates/ttyinv-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/kaygdotorg/ttyinv"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rust_decimal = "1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
