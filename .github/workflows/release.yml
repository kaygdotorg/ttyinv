name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  release:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: cargo check -p ttyinv-wasm --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --locked
      - run: cargo test -p ttyinv-wasm --target wasm32-unknown-unknown --no-run
      - run: wasm-bindgen-test-runner target/wasm32-unknown-unknown/debug/deps/ttyinv_wasm-*.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ttyinv-rust-release
          path: target/release/ttyinv
