name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-release.txt -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest --cov=ttyinv --cov-report=term-missing
      - name: Privacy gate
        run: python scripts/privacy_check.py .
      - name: Lint fabricated gallery
        shell: bash
        run: |
          while IFS= read -r -d '' invoice; do
            python -m ttyinv lint "$invoice" --strict
          done < <(find examples -name '*.md' -print0)
      - name: Verify generated schema
        run: |
          python -m ttyinv schema --output /tmp/ttyinv-v1.schema.json
          diff -u schema/ttyinv-v1.schema.json /tmp/ttyinv-v1.schema.json
      - name: Build distributions
        run: python -m build

  visual-contract:
    name: Visual contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-release.txt -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Vendor Geist Mono for canonical metrics
        run: python scripts/vendor_geist_mono.py
      - name: Render fabricated golden fixture
        run: |
          mkdir -p artifacts
          python -m ttyinv render examples/reference.md --format both --theme dark --deterministic --output artifacts/reference
      - name: Assert geometry
        run: |
          python scripts/visual_contract.py artifacts/reference.html \
            --screenshot artifacts/reference.png \
            --report artifacts/visual-contract.json
      - name: Check bundled font metrics
        shell: bash
        run: |
          font=$(find src/ttyinv/fonts -type f \( -name '*.woff2' -o -name '*.woff' -o -name '*.ttf' -o -name '*.otf' \) | head -n 1)
          test -n "$font"
          python scripts/font_metrics_check.py "$font" --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-contract
          path: artifacts/
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
