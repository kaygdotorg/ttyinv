name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-release.txt -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest --cov=ttyinv --cov-report=term-missing
      - name: Privacy gate
        run: python scripts/privacy_check.py .
      - name: Lint fabricated gallery
        shell: bash
        run: |
          while IFS= read -r -d '' invoice; do
            python -m ttyinv lint "$invoice"
          done < <(find examples -name '*.md' -print0)
      - name: Verify generated schema
        run: |
          python -m ttyinv schema --output /tmp/ttyinv-v1.schema.json
          diff -u schema/ttyinv-v1.schema.json /tmp/ttyinv-v1.schema.json
      - name: Build distributions
        run: python -m build
